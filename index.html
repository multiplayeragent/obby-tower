<script type="module">
/* ═══ OBBY TOWER · a Multiplayer Agent starter ═══════════════════════════════════════
 * Climb an obstacle course with checkpoints. Party, 2–16 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, bots, saves, and the COURSE: a list of pieces, bottom to top
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the shared clock
 *   COURSE ........ turns CONFIG.course into platforms around the tower; where they are at time t
 *   PHYSICS ....... one function moves any climber (you or a bot): run, jump, land, get knocked
 *   WORLD ......... the tower, sky, platforms and the blocky climbers
 *   BOTS (HOST) ... bots climb, wait for movers, and sometimes slip. Only the host runs them.
 *   ME ............ checkpoints, saves, falling, the climb timer. Each player writes only its own.
 *   HUD & DONE .... checkpoint, timer, who's highest, the top card, leaderboard
 *   INPUT ......... keyboard, and a touch stick plus a Jump button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, facing, animation,
 *     checkpoint, how far along it is) about 12 times a second, `hb` (heartbeat) once a
 *     second, and `n`/`c` (name, color) once. Climbers pass through each other.
 *   - Movers, lifts and spinners move on a SHARED CLOCK: their position is a function of
 *     time, so nobody streams them. The host writes `clk` (its clock) every 2 seconds and
 *     everyone else keeps the offset; a new host carries the same clock on.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes `clk` and `bots` (the bots' climbers).
 *     A new host adopts the bots where state has them.
 *   - Event (effects only): "top" {n, t} when someone reaches the top, for the toast.
 *   - Saves: your furthest checkpoint and best time go to player.data (namespace
 *     CONFIG.saveNs; localStorage when offline). You resume from that checkpoint.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-climb": a full climb from the start, stored as 3600000 - ms
 *     (boards keep the highest score), shown on the top card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  radius: 15,           // the course winds around the tower this far from its center
  speed: 7,             // run speed, units/s
  jump: 11,             // jump speed (about 2 units high)
  gravity: 30,
  airControl: 0.5,      // share of your steering you keep in the air
  fallBelow: 5,         // drop this far below your checkpoint and you go back to it

  board: "fastest-climb",

    { type: "movers", n: 3 }, { type: "stairs", n: 5 }, { type: "checkpoint" },
    { type: "spinner" }, { type: "jumps", n: 4, size: 1.8 }, { type: "checkpoint" },
    { type: "lifts", n: 3 }, { type: "beam" }, { type: "spinner" }, { type: "checkpoint" },

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.

// The shared clock: the host's Date.now() plus its own offset, learned from `clk` changes.
const clockSync = { offset: 0, seen: undefined, samples: [], lastWrite: 0 };

    clockSync.offset = Math.max(...clockSync.samples); // the least-delayed sample is the best
  }

// ── COURSE ──────────────────────────────────────────────────────────────────────────
/** Lay the pieces along a rising spiral around the tower. Each platform: size, base spot, yaw. */
function buildCourse() {
  const R = CONFIG.radius, path = [], bars = [];

  for (const piece of CONFIG.course) for (let j = 0; j < (piece.n || 1); j++) {

const course = buildCourse();
/** Where platform p is at clock time t (seconds). */
function platPos(p, t) {

  const off = p.move.amp * Math.sin((t * Math.PI * 2) / p.move.period + p.move.phase);
  return p.move.axis === "up" ? { x: p.x, y: p.y + off, z: p.z } : { x: p.x + Math.cos(p.th) * off, y: p.y, z: p.z + Math.sin(p.th) * off };

/** A spinner bar as a box: center and yaw at time t. */
const barPos = (b, t) => ({ x: b.plat.x, y: b.plat.y + b.plat.h / 2 + 0.55, z: b.plat.z, yaw: b.spin * t });

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
const BODY_R = 0.4, BODY_H = 1.8, TOWER_R = 9, ISLAND_R = 34;
/** A climber: you or a bot. */
function makeBody(x, y, z) { return { x, y, z, vx: 0, vy: 0, vz: 0, ry: 0, ground: null, coyote: 0, jumpBuf: 0, knock: 0, wasGround: false }; }
/** Move a climber for dt with input { mx, mz (world direction, length ≤ 1), jump }. Returns "land", "knock" or null. */

const towerTex = canvasTex(64, 64, (c) => { c.fillStyle = "#e9e4f5"; c.fillRect(0, 0, 64, 64); c.fillStyle = "#d4cbea"; c.fillRect(0, 0, 32, 32); c.fillRect(32, 32, 32, 32); }, true);

let started = 0;
function hud(now) {
  if (ATTRACT) { for (const id of ["cp", "top", "net", "hint", "feed"]) $(id).textContent = ""; return; }
  const cps = course.checkpoints.length - 1;
  $("cp").innerHTML = `${me.done ? "At the top!" : me.cp ? `Checkpoint ${me.cp}/${cps}` : "Start"} <small>${me.timed ? (me.startAt ? fmt((me.done ? me.doneAt : now) - me.startAt) : "Timer starts when you leave the start") : "Resumed from your save: not timed"}${me.best ? ` · best ${fmt(me.best)}` : ""}</small>`;
  const rows = climbers().map((c) => ({ n: c.name, pi: c.pi || 0, cp: c.cp || 0 })).concat([{ n: "You", pi: me.pi, cp: me.cp, me: true }]).sort((a, b) => b.pi - a.pi);
  $("top").innerHTML = rows.slice(0, 6).map((r) => `<div class="${r.me ? "me" : ""}"><span>${esc(r.n)}</span><span>${r.pi >= course.path.length - 1 ? "🏆" : `CP ${r.cp}`}</span></div>`).join("");
  $("hint").textContent = now - started < 9000 ? (touchUI ? "Left thumb to move · JUMP to jump" : "WASD or arrows to move · Space to jump") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the bots" : ""}`;
}
$("again").onclick = startClimb;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("stick").hidden = $("jumpBtn").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const KEYS = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if (e.key === " ") { e.preventDefault(); if (!e.repeat) input.jump = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
const stick = $("stick"), knob = $("knob");
let stickId = null;
function moveStick(e) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / 50, dy = (e.clientY - cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  input.sx = dx; input.sy = dy; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
}
stick.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveStick(e); });
for (const ev of ["pointerup", "pointercancel"]) stick.addEventListener(ev, (e) => { if (e.pointerId !== stickId) return; stickId = null; input.sx = input.sy = 0; knob.style.transform = ""; });
const jumpBtn = $("jumpBtn");
jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); input.jump = true; jumpBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove("on"));
cv.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const views = new Map(); // id -> { g, x, y, z, r } drawn climbers for everyone but me
let myAvatar = null;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  syncClock(now);
  const t = clock() / 1000;
  if (isHost()) hostTick(dt, now, t); else host.wasHost = false;
  if (!ATTRACT) myTick(dt, now, t); // ?attract has no climber of its own: the camera follows a bot
  if (me.done && !me.doneAt) me.doneAt = now; else if (!me.done) me.doneAt = 0;
  // moving platforms and spinners, from the shared clock
  course.path.forEach((p, i) => { if (p.move) { const a = platPos(p, t); platMeshes[i].position.set(a.x, a.y, a.z); } if (p.flag) p.flag.rotation.y = p.yaw + Math.sin(t * 3 + i) * 0.3; if (p.trophy) p.trophy.rotation.y = t; });
  course.bars.forEach((b, i) => { const a = barPos(b, t); barMeshes[i].position.set(a.x, a.y, a.z); barMeshes[i].rotation.y = a.yaw; });
  // everyone else, eased toward where they last said they were
  const seen = new Set();
  for (const c of climbers()) {
    seen.add(c.id);
    let v = views.get(c.id);
    if (!v) { v = { g: makeAvatar(c.color, ATTRACT ? "" : c.name), x: c.x, y: c.y, z: c.z, r: c.r }; views.set(c.id, v); }
    const k = c.bot && isHost() ? 1 : 1 - Math.pow(0.0005, dt);
    if (Math.hypot(c.x - v.x, c.y - v.y, c.z - v.z) > 8) Object.assign(v, { x: c.x, y: c.y, z: c.z }); // respawned: jump there
    v.x += (c.x - v.x) * k; v.y += (c.y - v.y) * k; v.z += (c.z - v.z) * k; v.r += Math.atan2(Math.sin(c.r - v.r), Math.cos(c.r - v.r)) * k;
    placeAvatar(v.g, v.x, v.y, v.z, v.r, c.a, t + v.x);
  }
  for (const [id, v] of views) if (!seen.has(id)) { dropAvatar(v.g); views.delete(id); }
  if (!myAvatar && !ATTRACT) myAvatar = makeAvatar(myColor, "");
  if (myAvatar) placeAvatar(myAvatar, me.x, me.y, me.z, me.ry, anim(me), t);
  // the camera: outside the tower, a little behind you along the course
  const target = ATTRACT ? host.bots.values().next().value || me : me;
  const th = Math.atan2(target.z, target.x), fx = -Math.sin(th), fz = Math.cos(th), back = camera.aspect < 1 ? 10 : 8;
  if (ATTRACT) { // the preview: a wider shot from outside, looking along the course ahead of one bot
    camPos.set(Math.cos(th - 0.42) * 24, target.y + 6.5, Math.sin(th - 0.42) * 24);
    camLook.lerp(new THREE.Vector3(Math.cos(th + 0.12) * 14, target.y + 1.8, Math.sin(th + 0.12) * 14), 1 - Math.pow(0.1, dt));
  } else {
    camPos.set(target.x - fx * back + Math.cos(th) * 2.5, target.y + 5, target.z - fz * back + Math.sin(th) * 2.5);
    camLook.set(target.x + fx * 4, target.y + 1.2, target.z + fz * 4);
  }
  camera.position.lerp(camPos, 1 - Math.pow(ATTRACT ? 0.1 : 0.004, dt)); camera.lookAt(camLook);
  tickConfetti(dt);
  renderer.render(scene, camera);
  if (now - lastHud > 120) { lastHud = now; hud(now); }
  requestAnimationFrame(frame);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("top", (msg) => { if (msg && msg.n) { announceTop(String(msg.n).slice(0, 24), Number(msg.t) || 0); if (!msg.bot) toast(`${String(msg.n).slice(0, 24)} reached the top!`); } });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 10, botSlip: 0.12 });
  respawnMe(0, false);
  if (!ATTRACT) {
    const save = await Promise.race([loadSave(), new Promise((ok) => setTimeout(() => ok(readLocal()), 2500))]);
    me.best = Number(save.best) || 0;
    const cp = Math.min(Number(save.cp) || 0, course.checkpoints.length - 1);
    if (cp > 0) { me.timed = false; respawnMe(cp, false); toast(`Welcome back! Checkpoint ${cp}`, 2200); }
  }
  camera.position.set(me.x + 10, me.y + 6, me.z - 8); camLook.set(me.x, me.y, me.z);
  started = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
